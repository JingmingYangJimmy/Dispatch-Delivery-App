spring.application.name=deliver
# =============================================
# Database Configuration
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_system
spring.datasource.username=postgres
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization (????database-init.sql)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database-init.sql
spring.sql.init.continue-on-error=false

# =============================================
# Google Maps API
# =============================================
google.maps.api.key=YOUR_GOOGLE_MAPS_API_KEY_HERE

# =============================================
# Cache Configuration
# =============================================
spring.cache.type=simple
spring.cache.cache-names=geocoding

# =============================================
# CORS Configuration (??React????)
# =============================================
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true